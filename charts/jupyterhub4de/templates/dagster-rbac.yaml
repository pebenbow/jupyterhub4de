# Grants Dagster's daemon just enough RBAC to manage the Job Pods it
# launches per run (issue #4), scoped to this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dagster
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dagster-job-pods
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dagster-job-pods
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: dagster
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: dagster-job-pods
  apiGroup: rbac.authorization.k8s.io
